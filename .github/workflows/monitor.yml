name: Monitor Cian

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

concurrency:
  group: cian-monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/CianMonitor/CianMonitor.csproj -c Release
      - run: pwsh src/CianMonitor/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Read Cian and build site
        id: collect
        continue-on-error: true
        run: dotnet run --project src/CianMonitor/CianMonitor.csproj -c Release --no-build
      - name: Save data and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json cian-monitor/status.json cian-monitor/listings.json cian-monitor/cian-monitor.xlsx
          git diff --cached --quiet || (git commit -m "Update Cian observations" && git push)
      - name: Fail job on collection error
        if: steps.collect.outcome == 'failure'
        run: exit 1
